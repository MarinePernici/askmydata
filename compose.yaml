services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: askmydata
      POSTGRES_USER: askmydata
      POSTGRES_PASSWORD: askmydata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmydata -d askmydata"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://askmydata:askmydata@db:5432/askmydata
      TEST_SOURCE_DB_HOST: host.docker.internal
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
