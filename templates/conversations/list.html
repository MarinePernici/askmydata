<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conversations</title>
</head>
<body>
    <nav>
        <a href="{% url 'project-list' %}">
            Projects
        </a>

        <a href="{% url 'project-detail' project.id %}">
            {{ project.name }}
        </a>
    </nav>

    <h1>Conversations</h1>
    <p>{{ project.name }}</p>

    <form
        method="post"
        action="{% url 'conversation-create' project.id %}"
    >
        {% csrf_token %}

        <label>
            Title
            <input
                type="text"
                name="title"
                maxlength="255"
            >
        </label>

        <button type="submit">New conversation</button>
    </form>

    <ul>
        {% for conversation in conversations %}
            <li>
                <a href="{% url 'conversation-detail' project.id conversation.id %}">
                    {{ conversation.title }}
                </a>
            </li>
        {% empty %}
            <li>No conversations yet.</li>
        {% endfor %}
    </ul>
</body>
</html>
