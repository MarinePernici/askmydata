<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
</head>
<body>
    <h1>Projects</h1>

    <a href="{% url 'project-create' %}">
        Create project
    </a>

    {% for project in projects %}
        <p>
            <a href="{% url 'project-detail' project.id %}">
                {{ project.name }}
            </a>
        </p>
    {% empty %}
        <p>No projects yet.</p>
    {% endfor %}
</body>
</html>
